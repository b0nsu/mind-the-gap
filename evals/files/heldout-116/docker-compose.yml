services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: shop
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    volumes:
      - pgdata:/var/lib/postgresql/data
  cron:
    image: alpine:3.20
    volumes:
      - ./backups:/backups
      - ./cron.d:/etc/periodic
volumes:
  pgdata:
